[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limiting-stickman-model"
version = "0.1.0"
description = "Быстрая сегментация человека геометрической stickman-моделью поверх MediaPipe Pose"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "nkarbofos" }]
keywords = ["segmentation", "pose-estimation", "mediapipe", "realtime", "iou"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Достаточно для track_stickman.py: демо-калибровка уже лежит в example/
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=9.5",
]

[project.optional-dependencies]
# Нужно для calibrate_stickman.py: YOLO-детектор + InSPyReNet (тянет torch)
calib = [
    "ultralytics>=8.4.0",
    "transparent-background>=1.3.4",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.urls]
Homepage = "https://github.com/nkarbofos/LimitingStickmanModel"
Issues = "https://github.com/nkarbofos/LimitingStickmanModel/issues"

[project.scripts]
stickman-track = "bench.cli:track"
stickman-calibrate = "bench.cli:calibrate"
stickman-download-models = "bench.download:cli"

[tool.setuptools]
packages = ["bench"]
py-modules = []
